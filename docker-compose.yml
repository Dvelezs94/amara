# Production stack (Ubuntu / Docker Engine + Compose plugin).
# Usage: docker compose up --build -d
# Local development (Postgres only): docker compose -f docker-compose.local.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: msa
      POSTGRES_PASSWORD: msa
      POSTGRES_DB: msa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msa -d msa"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time only (no DB connection required for `next build`). Must be a valid URL string.
        DATABASE_URL: postgresql://msa:msa@postgres:5432/msa
    image: msa-web:prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://msa:msa@postgres:5432/msa
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      TZ: America/Monterrey
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  postgres_data:
